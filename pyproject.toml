[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verinuddle"
version = "0.1.0"
description = "NestedTensor-aware Save/Load Latent nodes for ComfyUI, with optional custom-path variants"
authors = [
  {name = "Verigen", email = "verigen.project@gmail.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
requires-python = ">=3.10"
classifiers = []
dependencies = [

]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/verigen/verinuddle"
BugTracker = "https://github.com/verigen/verinuddle/issues"

[tool.comfy]
PublisherId = "verigen"
DisplayName = "Verinuddle"
Icon = ""
Tags = ["latent", "io"]
Repository = "https://github.com/verigen/verinuddle"

includes = []

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # Pyflakes
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
